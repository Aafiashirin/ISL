<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <span class="app-badge">Standard</span>
        <h1 class="app-title">Calculator</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" title="Toggle Theme (T)" aria-label="Toggle theme">
          <svg class="theme-icon sun" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="history-toggle" class="icon-button" title="Toggle History (H)" aria-label="Toggle history panel">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <main class="calculator-card">
      <!-- Screen Display -->
      <section class="display-container" aria-live="polite" aria-atomic="true">
        <div class="display-previous" id="display-previous"></div>
        <div class="display-current" id="display-current" data-testid="display-current">0</div>
      </section>

      <!-- Keypad -->
      <section class="keypad" role="region" aria-label="Calculator keypad">
        <!-- Row 1 -->
        <button class="key action" data-action="all-clear" title="Clear all (Escape)">AC</button>
        <button class="key action" data-action="delete" title="Backspace (Backspace)">DEL</button>
        <button class="key action" data-action="percent" title="Percentage (%)">%</button>
        <button class="key operator" data-operator="÷" title="Divide (/)">÷</button>

        <!-- Row 2 -->
        <button class="key number" data-number="7">7</button>
        <button class="key number" data-number="8">8</button>
        <button class="key number" data-number="9">9</button>
        <button class="key operator" data-operator="×" title="Multiply (*)">×</button>

        <!-- Row 3 -->
        <button class="key number" data-number="4">4</button>
        <button class="key number" data-number="5">5</button>
        <button class="key number" data-number="6">6</button>
        <button class="key operator" data-operator="-" title="Subtract (-)">−</button>

        <!-- Row 4 -->
        <button class="key number" data-number="1">1</button>
        <button class="key number" data-number="2">2</button>
        <button class="key number" data-number="3">3</button>
        <button class="key operator" data-operator="+" title="Add (+)">+</button>

        <!-- Row 5 -->
        <button class="key action" data-action="negate" title="Toggle Sign (±)">±</button>
        <button class="key number" data-number="0">0</button>
        <button class="key number" data-number="." title="Decimal (.)">.</button>
        <button class="key equals" data-action="calculate" title="Equals (= or Enter)">=</button>
      </section>
    </main>

    <!-- History Drawer / Modal -->
    <aside id="history-panel" class="history-panel hidden" aria-label="Calculation History">
      <div class="history-header">
        <h3>Calculation History</h3>
        <div class="history-header-actions">
          <button id="clear-history-btn" class="text-button" title="Clear History">Clear</button>
          <button id="close-history-btn" class="icon-button" aria-label="Close history">✕</button>
        </div>
      </div>
      <div id="history-list" class="history-list">
        <p class="history-empty">No calculations yet</p>
      </div>
    </aside>

    <footer class="app-footer">
      <span>Keyboard friendly: <code>0-9</code> <code>+ - * /</code> <code>Enter</code> <code>Esc</code> <code>Del</code></span>
    </footer>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
